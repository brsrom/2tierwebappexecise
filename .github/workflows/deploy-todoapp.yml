name: Build, push and deploy todoapp

on:
  push:
    branches: [main, dev]
    paths:
      - "app/todoapp/**"
      - ".github/workflows/deploy-todoapp.yml"
  workflow_dispatch: {}

env:
  ACR_NAME: acr2tierwizexercise2uv6ht
  ACR_LOGIN_SERVER: acr2tierwizexercise2uv6ht.azurecr.io
  IMAGE_NAME: todoapp
  RESOURCE_GROUP: rg-2tier-wizexercise
  AKS_CLUSTER: aks-2tier-wizexercise
  NAMESPACE: todoapp

permissions:
  contents: read
  security-events: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image locally
        run: |
          az acr login --name "$ACR_NAME"
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            app/todoapp/src

      - name: Scan image for CVEs (Trivy, log table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Scan image for CVEs (Trivy, SARIF for upload)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Push image to ACR
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: Generate SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Attach SBOM to image in ACR
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" | cut -d'@' -f2)
          oras attach \
            --artifact-type application/vnd.cyclonedx+json \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME@$DIGEST" \
            sbom.cdx.json:application/vnd.cyclonedx+json

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing

      - name: Apply namespace
        run: kubectl apply -f app/todoapp/k8s/namespace.yaml

      - name: Create or update app secrets
        run: |
          kubectl create secret generic todoapp-secrets -n "$NAMESPACE" \
            --from-literal=MONGODB_URI="mongodb://admin:${{ secrets.MONGODB_PASSWORD }}@10.0.1.4:27017/?authSource=admin" \
            --from-literal=SECRET_KEY="${{ secrets.APP_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply deployment and service
        run: kubectl apply -f app/todoapp/k8s/deployment.yaml -f app/todoapp/k8s/service.yaml

      - name: Apply cluster role binding
        run: kubectl apply -f app/todoapp/k8s/clusterrolebinding.yaml

      - name: Pin deployment to this build's image
        run: kubectl set image deployment/todoapp todoapp="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" -n "$NAMESPACE"

      - name: Wait for rollout
        run: kubectl rollout status deployment/todoapp -n "$NAMESPACE" --timeout=180s
